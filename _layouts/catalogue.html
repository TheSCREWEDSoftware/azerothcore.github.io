---
layout: default
---

<style>
  .header .container {
    display: none;
  }
  .header {
    padding-bottom: 0px;
  }
  @media (min-width: 1200px) {
    .catalogue-wide-container.container {
      width: 85% !important;
      max-width: 1800px !important;
    }
    .catalogue-wide-container .container {
      width: 100% !important;
      max-width: none !important;
    }
  }
</style>

<link
  href="{{ '/stylesheets/catalogue_style.css' | relative_url }}"
  rel="stylesheet"
/>

<script
  src="{{ '/javascripts/catalogue/runtime.js' | relative_url }}"
  type="module"
></script>
<script
  src="{{ '/javascripts/catalogue/polyfills.js' | relative_url }}"
  type="module"
></script>
<script
  src="{{ '/javascripts/catalogue/scripts.js' | relative_url }}"
  defer
></script>
<script
  src="{{ '/javascripts/catalogue/main.js' | relative_url }}"
  type="module"
></script>

<div class="header">
  <div class="container">
    <img
      class="logo"
      src="{{ '/images/logo.png' | relative_url }}"
      alt="AzerothCore logo"
    />
    <h1>AzerothCore</h1>
    <p class="lead">The open source MMORPG server application</p>
  </div>
  <!-- /.container -->
</div>

<div id="content" class="container catalogue-wide-container">
  {{content}}
  <app-root></app-root>
  <noscript>
    <div class="alert alert-warning mt-3">
      This catalogue requires JavaScript to run. Please enable JavaScript in
      your browser.
    </div>
  </noscript>
</div>
