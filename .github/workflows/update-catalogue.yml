name: Update Git-Catalogue

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22.12
        uses: actions/setup-node@v1
        with:
          node-version: "22.12"

      - name: Build 🔨
        run: |
          git clone https://github.com/azerothcore/git-catalogue
          cd git-catalogue
          export NODE_OPTIONS=--openssl-legacy-provider
          npm ci --no-audit --no-fund

          # Inject AzerothCore production config used by the Angular app at runtime
          mkdir -p src/assets
          cat > src/assets/config.json << 'JSON'
          {
            "perPage": 100,
            "pageSize": 8,
            "usePreGeneratedFile": true,
            "preGeneratedFileUrl": "/data/catalogue.json",
            "globalSearch": true,
            "tabs": {
              "All": {
                "path": "/all"
              },
              "Modules": {
                "topic": "azerothcore-module",
                "org": "azerothcore",
                "path": "/module"
              },
              "Tools": {
                "topic": "azerothcore-tools",
                "org": "azerothcore",
                "path": "/tools"
              },
              "Lua/Eluna/ALE Scripts": {
                "topic": "azerothcore-lua",
                "org": "azerothcore",
                "path": "/lua"
              },
              "SQL": {
                "topic": "azerothcore-sql",
                "org": "azerothcore",
                "path": "/sql"
              },
              "DBC": {
                "topic": "azerothcore-dbc",
                "org": "azerothcore",
                "path": "/dbc"
              }
            }
          }
          JSON

          npm run build -- --configuration=production --output-hashing=none

          mkdir -p ../javascripts/catalogue
          cp dist/git-catalogue/runtime.js   ../javascripts/catalogue/runtime.js
          cp dist/git-catalogue/polyfills.js ../javascripts/catalogue/polyfills.js
          cp dist/git-catalogue/scripts.js   ../javascripts/catalogue/scripts.js
          cp dist/git-catalogue/main.js      ../javascripts/catalogue/main.js

          # Copy CSS into the expected filename
          cp dist/git-catalogue/styles.css ../stylesheets/catalogue_style.css

          # Copy Angular assets so /assets/config.json is served by Pages
          mkdir -p ../assets
          rsync -a dist/git-catalogue/assets/ ../assets/

          cd ..
          rm -rf git-catalogue

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: master
          folder: .
